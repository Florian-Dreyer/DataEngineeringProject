[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "foodcom-pipeline"
version = "0.1.0"
description = "Lambda architecture pipeline for Food.com recipe and review analytics"
requires-python = ">=3.10"

dependencies = [
    # ── Data & Processing ───────────────────────────────────────────
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",

    # ── Database ────────────────────────────────────────────────────
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",

    # ── Orchestration ───────────────────────────────────────────────
    "apache-airflow>=2.9",

    # ── Streaming ───────────────────────────────────────────────────
    "kafka-python>=2.0",

    # ── NLP & Sentiment ─────────────────────────────────────────────
    "transformers>=4.40",       # DistilBERT (batch layer)
    "torch>=2.2",               # DistilBERT backend
    "nltk>=3.8",                # VADER (stream layer)

    # ── Machine Learning ────────────────────────────────────────────
    "xgboost>=2.0",

    # ── Dashboard ───────────────────────────────────────────────────
    "streamlit>=1.35",
    "plotly>=5.20",

    # ── Utilities ───────────────────────────────────────────────────
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",                # Linting & formatting
    "ipykernel>=6.0",           # Jupyter support for EDA
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]       # pycodestyle, pyflakes, isort

[tool.pytest.ini_options]
testpaths = ["tests"]
